<svg xmlns="http://www.w3.org/2000/svg" width="780" height="370" viewBox="0 0 780 370" font-family="Helvetica,Arial,sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="780" height="370" fill="white"/>
  <g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace">

  <!-- ===== dynamisch ===== -->
  <text x="200" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">dynamisch gelinkt</text>
  <text x="200" y="44" text-anchor="middle" font-size="12" fill="#555">gcc main.o greet.o -o main</text>

  <rect x="30" y="62" width="150" height="120" rx="4" fill="#eef5ff" stroke="#333"/>
  <text x="105" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">main</text>
  <line x1="30" y1="94" x2="180" y2="94" stroke="#333"/>
  <text x="44" y="118" font-size="13">main()</text>
  <text x="44" y="142" font-size="13">gruss()</text>
  <text x="44" y="166" font-size="13" fill="#c0392b">putc@plt</text>

  <rect x="240" y="62" width="130" height="120" rx="4" fill="#f4f6f8" stroke="#333" stroke-dasharray="6 3"/>
  <text x="305" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">libc.so.6</text>
  <line x1="240" y1="94" x2="370" y2="94" stroke="#333" stroke-dasharray="6 3"/>
  <text x="254" y="118" font-size="13">putc()</text>
  <text x="254" y="142" font-size="13">printf()</text>
  <text x="254" y="166" font-size="13">…</text>

  <path d="M140,162 C190,162 200,118 238,118" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="210" y="198" text-anchor="middle" font-size="11" fill="#c0392b" font-family="Helvetica,Arial,sans-serif">Aufruf erst zur Laufzeit</text>

  <rect x="30" y="214" width="340" height="44" rx="10" fill="#fff6d6" stroke="#333"/>
  <text x="200" y="233" text-anchor="middle" font-size="13">ld-linux-x86-64.so.2</text>
  <text x="200" y="250" text-anchor="middle" font-size="11" fill="#555" font-family="Helvetica,Arial,sans-serif">Loader: sucht und lädt libc.so.6 beim Programmstart</text>
  <path d="M305,214 L305,184" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="30" y="282" font-size="12" fill="#555">ldd main  → libc.so.6 =&gt; /lib/…/libc.so.6</text>

  <!-- ===== statisch ===== -->
  <line x1="398" y1="14" x2="398" y2="290" stroke="#ccc"/>
  <text x="590" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">statisch gelinkt</text>
  <text x="590" y="44" text-anchor="middle" font-size="12" fill="#555">gcc -static main.o greet.o -o main_static</text>

  <rect x="420" y="62" width="340" height="196" rx="4" fill="#eef5ff" stroke="#333"/>
  <text x="590" y="84" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">main_static</text>
  <line x1="420" y1="94" x2="760" y2="94" stroke="#333"/>
  <text x="434" y="118" font-size="13">main()</text>
  <text x="434" y="142" font-size="13">gruss()</text>
  <rect x="434" y="154" width="312" height="92" rx="4" fill="#f4f6f8" stroke="#888"/>
  <text x="446" y="174" font-size="11" fill="#555" font-family="Helvetica,Arial,sans-serif">aus libc.a hineinkopiert:</text>
  <text x="446" y="196" font-size="13">putc()  stdout  malloc()</text>
  <text x="446" y="216" font-size="13">__libc_start_main()</text>
  <text x="446" y="236" font-size="13">… viele weitere</text>

  <text x="420" y="282" font-size="12" fill="#555">ldd main_static → not a dynamic executable</text>
  </g>

  <!-- ===== Größe ===== -->
  <text x="30" y="318" font-weight="bold" font-size="13">Dateigröße</text>
  <text x="130" y="318" font-size="12" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace">main</text>
  <rect x="230" y="307" width="8" height="14" fill="#2f6fb3"/>
  <text x="246" y="318" font-size="12" fill="#555">≈ 16 KB</text>
  <text x="130" y="344" font-size="12" font-family="DejaVu Sans Mono,Menlo,Consolas,monospace">main_static</text>
  <rect x="230" y="333" width="400" height="14" fill="#2f6fb3"/>
  <text x="638" y="344" font-size="12" fill="#555">≈ 750 KB</text>
</svg>
