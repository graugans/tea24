<svg xmlns="http://www.w3.org/2000/svg" width="780" height="380" viewBox="0 0 780 380" font-family="Helvetica,Arial,sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="780" height="380" fill="white"/>

  <!-- ===== ar ===== -->
  <text x="20" y="26" font-weight="bold">1. Archiv bauen</text>
  <g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="13">
    <rect x="40" y="46" width="110" height="40" rx="4" fill="#f4f6f8" stroke="#333"/>
    <text x="95" y="71" text-anchor="middle">greet.o</text>
    <rect x="40" y="96" width="110" height="40" rx="4" fill="#f4f6f8" stroke="#333" stroke-dasharray="5 3"/>
    <text x="95" y="121" text-anchor="middle" fill="#777">weitere.o</text>

    <rect x="230" y="70" width="130" height="44" rx="10" fill="#fff6d6" stroke="#333"/>
    <text x="295" y="97" text-anchor="middle">ar rcs</text>
    <path d="M150,66 L228,86" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M150,116 L228,100" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
    <path d="M360,92 L438,92" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="440" y="40" width="180" height="106" rx="4" fill="#eef5ff" stroke="#333"/>
    <text x="530" y="62" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="bold">libgreet.a</text>
    <line x1="440" y1="72" x2="620" y2="72" stroke="#333"/>
    <rect x="456" y="82" width="148" height="24" rx="3" fill="white" stroke="#888"/>
    <text x="530" y="99" text-anchor="middle">greet.o</text>
    <rect x="456" y="112" width="148" height="24" rx="3" fill="white" stroke="#bbb" stroke-dasharray="5 3"/>
    <text x="530" y="129" text-anchor="middle" fill="#777">weitere.o</text>
  </g>
  <text x="640" y="80" font-size="12" fill="#555">nur eine Sammlung</text>
  <text x="640" y="96" font-size="12" fill="#555">von .o-Dateien –</text>
  <text x="640" y="112" font-size="12" fill="#555">kein Linken!</text>

  <!-- ===== Reihenfolge ===== -->
  <text x="20" y="186" font-weight="bold">2. Der Linker liest von links nach rechts</text>
  <line x1="20" y1="196" x2="760" y2="196" stroke="#ccc"/>

  <g font-family="DejaVu Sans Mono,Menlo,Consolas,monospace" font-size="13">
    <!-- richtig -->
    <text x="20" y="228" fill="#1e7b34" font-weight="bold">✓</text>
    <text x="40" y="228">gcc main.o -L. -lgreet</text>
    <rect x="40" y="242" width="110" height="34" rx="4" fill="#f4f6f8" stroke="#333"/>
    <text x="95" y="264" text-anchor="middle">main.o</text>
    <path d="M150,259 L238,259" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="240" y="242" width="130" height="34" rx="4" fill="#eef5ff" stroke="#333"/>
    <text x="305" y="264" text-anchor="middle">libgreet.a</text>
    <text x="155" y="292" font-size="11" fill="#c0392b" font-family="Helvetica,Arial,sans-serif">offen: gruss</text>
    <text x="390" y="264" font-size="12" fill="#1e7b34" font-family="Helvetica,Arial,sans-serif">gruss wird gebraucht → greet.o wird übernommen</text>

    <!-- falsch -->
    <text x="20" y="328" fill="#c0392b" font-weight="bold">✗</text>
    <text x="40" y="328">gcc -L. -lgreet main.o</text>
    <rect x="40" y="338" width="130" height="34" rx="4" fill="#eef5ff" stroke="#333"/>
    <text x="105" y="360" text-anchor="middle">libgreet.a</text>
    <path d="M170,355 L258,355" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
    <rect x="260" y="338" width="110" height="34" rx="4" fill="#f4f6f8" stroke="#333"/>
    <text x="315" y="360" text-anchor="middle">main.o</text>
    <text x="390" y="351" font-size="12" fill="#c0392b" font-family="Helvetica,Arial,sans-serif">noch nichts offen → aus libgreet.a wird nichts genommen</text>
    <text x="390" y="368" font-size="12" fill="#c0392b">undefined reference to `gruss'</text>
  </g>
</svg>
