<text text-anchor="start" x="25.5" y="-67.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="48.5" y="-67.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">Warum PIE?</text>
<text text-anchor="start" x="130.5" y="-67.4" font-family="Helvetica,sans-Serif" font-size="12.00"> Sicherheit: Ein Angreifer, der einen Speicherfehler ausnutzt,</text>
<text text-anchor="start" x="25.5" y="-55.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;kennt die Adressen von Code und Daten nicht im Voraus (ASLR).</text>
<text text-anchor="start" x="25.5" y="-43.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="48.5" y="-43.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">Wie?</text>
<text text-anchor="start" x="81.5" y="-43.4" font-family="Helvetica,sans-Serif" font-size="12.00"> Der Code adressiert relativ zum Befehlszähler (%rip) statt absolut,</text>
<text text-anchor="start" x="25.5" y="-31.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;Bibliotheksfunktionen über PLT/GOT. Auf x86&#45;64 kostet das kaum Leistung.</text>
<text text-anchor="start" x="25.5" y="-19.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="48.5" y="-19.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">Statisch?</text>
<text text-anchor="start" x="111.5" y="-19.4" font-family="Helvetica,sans-Serif" font-size="12.00"> gcc &#45;static → EXEC (feste Adressen), gcc &#45;static&#45;pie → DYN</text>
<text text-anchor="start" x="25.5" y="-7.4" font-family="Helvetica,sans-Serif" font-size="12.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="48.5" y="-7.4" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="12.00">Mikrocontroller:</text>
<text text-anchor="start" x="157.5" y="-7.4" font-family="Helvetica,sans-Serif" font-size="12.00"> kein Loader, kein ASLR → feste Adressen aus dem Linkerskript</text>
</g>
