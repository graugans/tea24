<!-- why -->
<g id="node3" class="node">
<title>why</title>
<polygon fill="#fafafa" stroke="#9e9e9e" points="1030,-105 603,-105 603,-37 1036,-37 1036,-99 1030,-105"/>
<polyline fill="none" stroke="#9e9e9e" points="1030,-105 1030,-99 "/>
<polyline fill="none" stroke="#9e9e9e" points="1036,-99 1030,-99 "/>
<text text-anchor="start" x="611" y="-94" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="630" y="-94" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Warum PIE?</text>
<text text-anchor="start" x="698" y="-94" font-family="Helvetica,sans-Serif" font-size="10.00"> Sicherheit: Ein Angreifer, der einen Speicherfehler ausnutzt,</text>
<text text-anchor="start" x="611" y="-84" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;kennt die Adressen von Code und Daten nicht im Voraus (ASLR).</text>
<text text-anchor="start" x="611" y="-74" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="630" y="-74" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Wie?</text>
<text text-anchor="start" x="658" y="-74" font-family="Helvetica,sans-Serif" font-size="10.00"> Der Code adressiert relativ zum Befehlszähler (%rip) statt absolut,</text>
<text text-anchor="start" x="611" y="-64" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;Bibliotheksfunktionen über PLT/GOT. Auf x86&#45;64 kostet das kaum Leistung.</text>
<text text-anchor="start" x="611" y="-54" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="630" y="-54" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Statisch?</text>
<text text-anchor="start" x="682" y="-54" font-family="Helvetica,sans-Serif" font-size="10.00"> gcc &#45;static → EXEC (feste Adressen), gcc &#45;static&#45;pie → DYN</text>
<text text-anchor="start" x="611" y="-44" font-family="Helvetica,sans-Serif" font-size="10.00"> &#160;&#160;&#160;&#160;&#160;</text>
<text text-anchor="start" x="630" y="-44" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="10.00">Mikrocontroller:</text>
<text text-anchor="start" x="722" y="-44" font-family="Helvetica,sans-Serif" font-size="10.00"> kein Loader, kein ASLR → feste Adressen aus dem Linkerskript</text>
</g>
